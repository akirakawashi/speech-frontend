# Единственная точка входа браузера в Speech Analytics.
#
# `/`      → `speech-frontend` (Next.js standalone)
# `/api/`  → `speech-ms` (FastAPI)
#
# Оба за одним источником намеренно: с раздельными доменами понадобился бы CORS
# и preflight на каждый запрос, а `SPEECH_API_URL` можно оставить пустым —
# фронт ходит по относительному пути, и подменять там нечего.

upstream speech_frontend {
    server speech-frontend:3000;
    keepalive 16;
}

upstream speech_api {
    server speech-ms:8096;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # Записи разговоров идут потоком, и длина заранее неизвестна. Ограничение по
    # умолчанию (1 МБ) обрезало бы выгрузку CSV на первой же сотне строк.
    client_max_body_size 16m;

    # Заголовки безопасности. `frame-ancestors 'none'`, потому что встраивать
    # интерфейс с записями разговоров в чужую страницу не должен никто.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Своя проверка живости края, не зависящая ни от фронта, ни от API:
    # иначе «край жив» и «за краем кто-то жив» перестают различаться.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # `$upstream$uri$is_args$args`, а не `$request_uri`: при двойном слэше в
        # адресе (`//api/v1/search`) `$request_uri` передаётся как есть, и
        # FastAPI отвечает 404 на путь, которого нет в маршрутах. `$uri` уже
        # нормализован nginx. Это дефект 18 журнала альфа-миграции, и он стоил
        # половины дня.
        proxy_pass http://speech_api$uri$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Диапазоны — насквозь в обе стороны. Без этого плеер скачивает часовую
        # запись целиком, чтобы отмотать на середину.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;

        # Расшифровка живёт минутами; выгрузка CSV на десять тысяч строк —
        # десятками секунд. Таймаут по умолчанию (60 с) рвал бы и то и другое.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://speech_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
